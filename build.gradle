plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    maven { url = "https://maven.isxander.dev/releases" }
    ivy {
        name = "SdlGitHubReleases"
        url = uri("https://github.com/libsdl-org/SDL/releases/download")
        patternLayout {
            artifact("release-[revision]/[artifact]-[revision]-[classifier].[ext]")
        }
        metadataSources {
            artifact()
        }
        content {
            includeModule("org.libsdl", "SDL3")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

configurations {
    bundleShadow
    sdlNative
    sodiumDistribution
    api.extendsFrom bundleShadow
    runtimeOnly.extendsFrom bundleShadow
}

def sdlNativeVersion = '3.4.18'

def sodiumCompileJar = layout.buildDirectory.file('sodium-api/sodium-neoforge.jar')

def extractSodiumCompileJar = tasks.register('extractSodiumCompileJar', Copy) {
    from({
        configurations.sodiumDistribution.collect { archive -> zipTree(archive) }
    })
    include 'META-INF/jarjar/net.caffeinemc.sodium-neoforge-*-mod.jar'
    eachFile { details ->
        details.path = 'sodium-neoforge.jar'
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('sodium-api')
}

afterEvaluate {
    configurations.named('additionalRuntimeClasspath').configure {
        extendsFrom(configurations.bundleShadow)
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    transformService {
        java.setSrcDirs(['src/transformService/java'])
        resources.setSrcDirs(['src/transformService/resources'])
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    main {
        runtimeClasspath += sourceSets.transformService.output
    }
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

def transformServiceJar = tasks.register('transformServiceJar', Jar) {
    archiveBaseName.set("${mod_id}-runtime-transform")
    archiveVersion.set(mod_version)
    destinationDirectory.set(layout.buildDirectory.dir('runtime-transform'))
    from(sourceSets.transformService.output)
    manifest {
        attributes([
                'Automatic-Module-Name': 'java_reforged.runtime_transform',
                'FMLModType'         : 'LIBRARY'
        ])
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            programArguments.addAll '--width', '1280', '--height', '720'
            if (project.hasProperty('devUsername')) {
                programArguments.addAll '--username', project.property('devUsername').toString()
            }

            if (project.hasProperty('devGraphicsBackend')) {
                def backend = project.property('devGraphicsBackend').toString().toUpperCase(java.util.Locale.ROOT)
                if (!(backend in ['OPENGL', 'VULKAN'])) {
                    throw new GradleException("devGraphicsBackend must be OPENGL or VULKAN, but was: ${backend}")
                }
                programArguments.addAll '--graphicsBackend', backend
            }

            if (project.hasProperty('devRunDirectory')) {
                gameDirectory = project.file(project.property('devRunDirectory').toString())
            }

            // The runtime field redirect must be visible to ModLauncher before
            // Minecraft classes are transformed and loaded.
            taskBefore tasks.named(sourceSets.transformService.classesTaskName)

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Uses the same game directory and settings as the regular client. A
        // separate run keeps Steam's username out of IntelliJ's argument file.
        steamClient {
            client()
            gameDirectory = project.file('run')
            if (project.hasProperty('steamUsername')) {
                programArguments.addAll '--username', project.property('steamUsername').toString()
            }
            taskBefore tasks.named(sourceSets.transformService.classesTaskName)
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // FML 11 replaced ModLauncher's launch plugins with class processors.
    // The loader is already supplied by NeoForge at runtime; this is API-only.
    transformServiceCompileOnly "net.neoforged.fancymodloader:loader:11.0.13"
    jarJar files(transformServiceJar)

    // Sodium's NeoForge distribution keeps its compile-time API in a nested
    // jar. Extract it only into build/ so Sodium stays an optional runtime mod.
    sodiumDistribution "maven.modrinth:AANobbMI:${sodium_modrinth_version_id}"
    compileOnly files(sodiumCompileJar) {
        builtBy extractSodiumCompileJar
    }
    runtimeOnly "maven.modrinth:AANobbMI:${sodium_modrinth_version_id}"
    compileOnly "maven.modrinth:nvQzSEkH:${jade_modrinth_version_id}"
    compileOnly "maven.modrinth:5sy6g3kz:${bettercombat_modrinth_version_id}"
    compileOnly "maven.modrinth:wGKYL7st:${combat_roll_modrinth_version_id}"
    compileOnly "maven.modrinth:XvoWJaA2:${spell_engine_modrinth_version_id}"
    compileOnly "maven.modrinth:1bokaNcj:${xaero_minimap_modrinth_version_id}"
    compileOnly "maven.modrinth:NcUtCpym:${xaero_world_map_modrinth_version_id}"
    compileOnly "maven.modrinth:vvuO3ImH:${curios_version}"

    // Development-only FerriteCore compatibility test. Gradle supplies the mod
    // to NeoForge runs, but it is not bundled or declared as a required mod.
    runtimeOnly "maven.modrinth:uXXizFIs:${ferritecore_modrinth_version_id}"

    // Video decoder. Kept at the exact versions used by Reforged API.
    def javacpp_ver = "1.5.10"
    def ffmpeg_ver = "6.1.1-${javacpp_ver}"

    [
            "org.bytedeco:javacpp:${javacpp_ver}",
            "org.bytedeco:ffmpeg:${ffmpeg_ver}",
            "org.bytedeco:ffmpeg:${ffmpeg_ver}:windows-x86_64",
            "org.bytedeco:javacpp:${javacpp_ver}:windows-x86_64",
            "org.bytedeco:javacv:${javacpp_ver}"
    ].each { dep ->
        bundleShadow dep
        api dep
    }

    // SDL3 Java bindings and Windows native used by the old Java Reforged.
    def libsdl4j_ver = '3.2.18.release-3.2.18-82'
    bundleShadow "dev.isxander:libsdl4j:${libsdl4j_ver}"
    api "dev.isxander:libsdl4j:${libsdl4j_ver}"

    bundleShadow 'net.java.dev.jna:jna:5.14.0'
    api 'net.java.dev.jna:jna:5.14.0'

    // libsdl4j currently publishes 3.2.18 bindings, but SDL keeps ABI
    // compatibility within major version 3. Use the current native runtime so
    // the GameInput/GIP drivers added after 3.2.18 are available.
    sdlNative "org.libsdl:SDL3:${sdlNativeVersion}:win32-x64@zip"
    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.register('copySdlNatives', Copy) {
    from({ configurations.sdlNative.collect { archive -> zipTree(archive) } }) {
        include 'SDL3.dll'
    }
    into(layout.buildDirectory.dir('sdl-natives/windows-x86_64'))
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('copySdlNatives')
    from(layout.buildDirectory.dir('sdl-natives/windows-x86_64')) {
        into 'natives/windows-x86_64'
    }
}

shadowJar {
    archiveClassifier.set('all')
    configurations = [project.configurations.bundleShadow]
    dependsOn tasks.named('copySdlNatives')

    dependsOn tasks.named('jarJar')
    from(tasks.named('jarJar'))

    manifest {
        attributes(['Multi-Release': 'true'])
    }

    exclude('META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
    exclude 'net/neoforged/**'
    mergeServiceFiles()
}

tasks.assemble.dependsOn tasks.shadowJar

tasks.named('jar', Jar) {
    finalizedBy('shadowJar')
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        scopes.RUNTIME.plus += [configurations.bundleShadow]
        downloadSources = true
        downloadJavadoc = true
    }
}



tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
